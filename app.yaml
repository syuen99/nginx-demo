apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/syuen99/nginx-demo.git
    targetRevision: main
    path: overlays/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gitops